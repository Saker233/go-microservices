apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-service
  template:
    metadata:
      labels:
        app: logger-service
    spec:
      containers:
      - name: logger-service
        image: "saker233/logger-service:latest"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 8000
          - containerPort: 5001
          - containerPort: 50001

---

apiVersion: v1
kind: Service
metadata:
  name: logger-service
spec:
  selector:
    app: logger-service
  ports:
    - protocol: TCP
      name: web-ports
      port: 8000
      targetPort: 8000
    - protocol: TCP
      name: rpc-ports
      port: 5001
      targetPort: 5001
    - protocol: TCP
      name: grpc-ports
      port: 50001
      targetPort: 50001